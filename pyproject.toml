[project]
name = "diy-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jason Sicotte", email = "sicotte.jason@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.2",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pyright>=1.1"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
